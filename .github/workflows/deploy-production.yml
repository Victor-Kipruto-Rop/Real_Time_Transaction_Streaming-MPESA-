name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to deploy (for example v1.2.3)
        required: true
        type: string
      dry_run:
        description: Validate only; do not deploy
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: us-east-1
  PROD_NAMESPACE: mpesa-production
  PROD_BASE_URL: ${{ vars.PROD_BASE_URL || 'https://api.your-domain.com' }}
  DEPLOY_VERSION: ${{ github.event.inputs.version || github.ref_name }}

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      - name: Validate version format
        run: |
          if [[ ! "${DEPLOY_VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: ${DEPLOY_VERSION}. Expected format: v1.0.0"
            exit 1
          fi

      - name: Enforce non-default secret policy
        env:
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          for name in WEBHOOK_SIGNING_SECRET SECRET_KEY POSTGRES_PASSWORD; do
            value="${!name:-}"
            if [ -z "$value" ] || [[ "$value" =~ (change_me|example|default|placeholder|admin123|secret)$ ]]; then
              echo "::error::$name must be set to a real non-default secret value"
              exit 1
            fi
          done

      - name: Run unit tests
        run: |
          pytest tests/unit -q --maxfail=1

      - name: Run smoke tests
        env:
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          REQUIRE_WEBHOOK_SIGNATURE: "true"
        run: |
          pytest tests/e2e/smoke_tests.py -q --maxfail=1

  security-scan:
    name: Security scan
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    name: Build production images
    needs: [validate, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [webhook-receiver, kafka-consumer, dbt]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=production-latest
            type=sha,prefix=prod-

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ env.DEPLOY_VERSION }}
            COMMIT_SHA=${{ github.sha }}

  backup:
    name: Snapshot production database
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check AWS access
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "Skipping database snapshot because AWS credentials are not configured."
            exit 0
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create RDS snapshot
        run: |
          aws rds create-db-snapshot \
            --db-instance-identifier mpesa-prod-db \
            --db-snapshot-identifier mpesa-prod-backup-${{ github.run_number }}-$(date +%Y%m%d-%H%M%S)

  deploy:
    name: Deploy to production
    needs: [build, backup]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event.inputs.dry_run != 'true' }}
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ vars.PROD_BASE_URL || 'https://api.your-domain.com' }}
    steps:
      - name: Check required production secrets and vars
        shell: bash
        env:
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
        run: |
          set -euo pipefail
          for name in WEBHOOK_SIGNING_SECRET SECRET_KEY; do
            value="${!name:-}"
            if [ -z "$value" ] || [[ "$value" =~ (change_me|example|default|placeholder|admin123|secret)$ ]]; then
              echo "::error::$name is missing or still set to a default value"
              exit 1
            fi
          done
          if [ -z "${PROD_BASE_URL:-}" ]; then
            echo "::error::PROD_BASE_URL repository variable must be configured"
            exit 1
          fi
          if [ -z "${AWS_ROLE_TO_ASSUME:-}" ] && { [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; }; then
            echo "::error::Either AWS_ROLE_TO_ASSUME or both AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must be configured"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: production-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials via static keys
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.27.0'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name mpesa-production-cluster --region ${{ env.AWS_REGION }}

      - name: Backup current deployment state
        run: |
          kubectl get deployment webhook-receiver -n ${{ env.PROD_NAMESPACE }} -o yaml > webhook-receiver-backup.yaml || true
          kubectl get deployment kafka-consumer -n ${{ env.PROD_NAMESPACE }} -o yaml > kafka-consumer-backup.yaml || true

      - name: Deploy new production image
        run: |
          kubectl set image deployment/webhook-receiver \
            webhook-receiver=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-webhook-receiver:production-latest \
            -n ${{ env.PROD_NAMESPACE }}
          kubectl set image deployment/kafka-consumer \
            kafka-consumer=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-kafka-consumer:production-latest \
            -n ${{ env.PROD_NAMESPACE }}
          kubectl rollout status deployment/webhook-receiver -n ${{ env.PROD_NAMESPACE }} --timeout=10m
          kubectl rollout status deployment/kafka-consumer -n ${{ env.PROD_NAMESPACE }} --timeout=10m

      - name: Run production smoke tests
        env:
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          REQUIRE_WEBHOOK_SIGNATURE: "true"
        run: |
          pytest tests/e2e/smoke_tests.py -q --maxfail=1

      - name: Verify deployment health
        run: |
          kubectl get pods -n ${{ env.PROD_NAMESPACE }}
          kubectl get ingress -n ${{ env.PROD_NAMESPACE }}

  notify:
    name: Notify release result
    needs: [deploy]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Release signal and production health gate
        shell: bash
        env:
          PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
        run: |
          if [ "${{ needs.deploy.result }}" != "success" ]; then
            echo "Production deployment failed or was skipped."
            exit 1
          fi

          if [ -z "${PROD_BASE_URL:-}" ]; then
            echo "PROD_BASE_URL is not configured; cannot verify production health."
            exit 1
          fi

          echo "Monitoring green environment..."
          curl -fsS "${PROD_BASE_URL}/health" | jq -e '.status == "ok" or .status == "healthy"' >/dev/null
          echo "Production deployment completed successfully and health checks are green."

      - name: Scale down blue environment
        if: ${{ success() && secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          kubectl scale deployment webhook-receiver-blue --replicas=0 -n mpesa-production
          kubectl scale deployment kafka-consumer-blue --replicas=0 -n mpesa-production

      - name: Run database migrations
        if: ${{ success() && secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          kubectl run dbt-migrate-prod-${{ github.run_number }} \
            --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dbt:${{ env.DEPLOY_VERSION }} \
            --restart=Never \
            --namespace=mpesa-production \
            --command -- dbt run --target production

          kubectl wait --for=condition=complete job/dbt-migrate-prod-${{ github.run_number }} \
            -n mpesa-production --timeout=15m

      - name: Verify deployment
        if: ${{ success() && secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          kubectl get pods -n mpesa-production
          curl -f "${{ vars.PROD_BASE_URL }}/health" || exit 1
          kubectl exec -n mpesa-production deployment/webhook-receiver -- \
            python -c "from app.database.connection import check_db; print(check_db())"

      - name: Update deployment tags
        if: ${{ success() && secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          kubectl label deployment webhook-receiver -n mpesa-production \
            version=${{ env.DEPLOY_VERSION }} --overwrite
          kubectl label deployment kafka-consumer -n mpesa-production \
            version=${{ env.DEPLOY_VERSION }} --overwrite

  rollback:
    name: Rollback on Failure
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    if: failure()
    steps:
      - name: Configure AWS credentials
        if: secrets.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install kubectl
        if: secrets.AWS_ACCESS_KEY_ID != ''
        uses: azure/setup-kubectl@v5

      - name: Configure kubectl
        if: secrets.AWS_ACCESS_KEY_ID != ''
        run: |
          aws eks update-kubeconfig --name mpesa-production-cluster --region us-east-1

      - name: Rollback to blue environment
        if: secrets.AWS_ACCESS_KEY_ID != ''
        run: |
          # Switch traffic back to blue
          kubectl patch service webhook-receiver -n mpesa-production \
            -p '{"spec":{"selector":{"version":"blue"}}}'
          
          # Scale up blue environment
          kubectl scale deployment webhook-receiver-blue --replicas=3 -n mpesa-production
          kubectl scale deployment kafka-consumer-blue --replicas=2 -n mpesa-production
          
          # Scale down green environment
          kubectl scale deployment webhook-receiver-green --replicas=0 -n mpesa-production
          kubectl scale deployment kafka-consumer-green --replicas=0 -n mpesa-production

      - name: Notify team of rollback
        if: secrets.AWS_ACCESS_KEY_ID != ''
        run: |
          echo "Deployment failed. Rolled back to previous version."

  post-deploy:
    name: Post-Deployment Tasks
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    if: false
    steps:
      - name: Warm up caches
        run: |
          # Warm up Redis cache
          curl -X POST https://api.your-domain.com/admin/cache/warmup \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}"

      - name: Update monitoring dashboards
        run: |
          # Update Grafana annotations
          curl -X POST https://grafana.your-domain.com/api/annotations \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "Production deployment: ${{ env.DEPLOY_VERSION }}",
              "tags": ["deployment", "production"],
              "time": '$(($(date +%s) * 1000))'
            }'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DEPLOY_VERSION }}
          name: Release ${{ env.DEPLOY_VERSION }}
          body: |
            ## Changes in this Release
            
            See [CHANGELOG.md](CHANGELOG.md) for details.
            
            ## Deployment Information
            - **Deployed at**: ${{ github.event.head_commit.timestamp }}
            - **Deployed by**: ${{ github.actor }}
            - **Commit**: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Team
    needs: [validate, security-scan, build, backup, deploy, post-deploy]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: always()
    steps:
      - name: Send Slack notification
        if: secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "Production Deployment ${{ needs.deploy.result }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "🚀 Production Deployment"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Status:*\n${{ needs.deploy.result }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Version:*\n${{ env.DEPLOY_VERSION }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Deployed by:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit:*\n${{ github.sha }}"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Deployment"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Grafana"
                      },
                      "url": "https://grafana.your-domain.com"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send email notification
        if: needs.deploy.result == 'success'
        run: |
          # Send email to stakeholders
          echo "Production deployment successful: ${{ env.DEPLOY_VERSION }}" | \
            mail -s "Production Deployment Success" stakeholders@your-domain.com
