name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag override
        required: false
        default: ""
      dry_run:
        description: Validate without deploying
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: us-east-1
  STAGING_NAMESPACE: mpesa-staging
  STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL || 'https://staging.your-domain.com' }}

concurrency:
  group: staging-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate runtime and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt

      - name: Validate configuration contract
        run: |
          python -m compileall app ingestion schemas

      - name: Enforce non-default secret policy
        env:
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          for name in WEBHOOK_SIGNING_SECRET SECRET_KEY POSTGRES_PASSWORD; do
            value="${!name:-}"
            if [ -z "$value" ] || [[ "$value" =~ (change_me|example|default|placeholder|admin123|secret)$ ]]; then
              echo "::error::$name must be set to a real non-default secret value"
              exit 1
            fi
          done

      - name: Run unit tests
        run: |
          pytest tests/unit -q --maxfail=1

      - name: Run E2E smoke tests
        env:
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          REQUIRE_WEBHOOK_SIGNATURE: "true"
        run: |
          pytest tests/e2e/smoke_tests.py -q --maxfail=1

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          flags: unittests

  security:
    name: Security scanning
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]

      - name: Run static security scan
        run: |
          bandit -r app ingestion schemas -q

  build:
    name: Build Docker images
    needs: [validate, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [webhook-receiver, kafka-consumer]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL || 'https://staging.your-domain.com' }}
    env:
      STAGING_IMAGE_TAG: ${{ github.event.inputs.image_tag != '' && github.event.inputs.image_tag || github.sha }}
    steps:
      - name: Check required staging secrets and variables
        shell: bash
        env:
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          for name in WEBHOOK_SIGNING_SECRET SECRET_KEY; do
            value="${!name:-}"
            if [ -z "$value" ] || [[ "$value" =~ (change_me|example|default|placeholder|admin123|secret)$ ]]; then
              echo "::error::$name is missing or still set to a default value"
              exit 1
            fi
          done
          if [ -z "${STAGING_BASE_URL:-}" ]; then
            echo "::error::STAGING_BASE_URL repository variable must be configured"
            exit 1
          fi
          if [ -z "${AWS_ROLE_TO_ASSUME:-}" ] && { [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; }; then
            echo "::error::Either AWS_ROLE_TO_ASSUME or both AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY must be configured"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: staging-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials via static keys
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' && secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        uses: aws-actions/configure-aws-credentials@v6.2.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: 'v1.27.0'

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name mpesa-staging-cluster --region ${{ env.AWS_REGION }}

      - name: Skip deploy on dry-run request
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry run requested; staging deployment validation passed without applying changes."
          exit 0

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/webhook-receiver \
            webhook-receiver=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-webhook-receiver:staging-${{ github.sha }} \
            -n ${{ env.STAGING_NAMESPACE }}

          kubectl set image deployment/kafka-consumer \
            kafka-consumer=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-kafka-consumer:staging-${{ github.sha }} \
            -n ${{ env.STAGING_NAMESPACE }}

          kubectl rollout status deployment/webhook-receiver -n ${{ env.STAGING_NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/kafka-consumer -n ${{ env.STAGING_NAMESPACE }} --timeout=5m

      - name: Run database migrations
        run: |
          kubectl run dbt-migrate-${{ github.run_number }} \
            --image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dbt:staging-${{ github.sha }} \
            --restart=Never \
            --namespace=${{ env.STAGING_NAMESPACE }} \
            --command -- dbt run

          kubectl wait --for=condition=complete job/dbt-migrate-${{ github.run_number }} \
            -n ${{ env.STAGING_NAMESPACE }} --timeout=10m

      - name: Verify deployment health
        run: |
          kubectl get pods -n ${{ env.STAGING_NAMESPACE }}
          curl -fsS "${{ vars.STAGING_BASE_URL }}/api/v1/health" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("status") == "healthy", data'

      - name: Run smoke tests against staging
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          REQUIRE_WEBHOOK_SIGNATURE: "true"
        run: |
          pytest tests/e2e/smoke_tests.py -q --maxfail=1 --staging

      - name: Capture pod diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n ${{ env.STAGING_NAMESPACE }} -o wide || true
          kubectl describe deployment/webhook-receiver -n ${{ env.STAGING_NAMESPACE }} || true
          kubectl describe deployment/kafka-consumer -n ${{ env.STAGING_NAMESPACE }} || true
          kubectl logs deployment/webhook-receiver -n ${{ env.STAGING_NAMESPACE }} --tail=200 || true
          kubectl logs deployment/kafka-consumer -n ${{ env.STAGING_NAMESPACE }} --tail=200 || true

  notify:
    name: Notify team
    needs: [validate, security, build, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2
        with:
          payload: |
            {
              "text": "Staging deployment ${{ needs.deploy.result }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment*\n*Status:* ${{ needs.deploy.result }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Author:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
