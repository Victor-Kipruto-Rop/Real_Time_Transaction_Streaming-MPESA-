name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "hardening/**"

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-compose:
    name: Static checks and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare diagnostic artifact directory
        run: mkdir -p artifacts

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip 2>&1 | tee artifacts/pip-upgrade.log
          python -m pip install -r requirements/base.txt -r requirements/data.txt "pytest==8.3.5" 2>&1 | tee artifacts/pip-install.log

      - name: Compile Python files and check shell scripts
        run: |
          python -m compileall -q app ingestion schemas streaming tests alembic scripts 2>&1 | tee artifacts/compile.log
          bash -n scripts/backup_postgres.sh scripts/restore_postgres.sh scripts/verify_deployment.sh 2>&1 | tee artifacts/shell-syntax.log

      - name: Run unit and contract tests
        run: |
          python -m pytest -q tests/test_config_security.py tests/test_database_ddl.py tests/test_event_identity.py tests/test_callback_validation.py tests/test_outbox.py tests/integration 2>&1 | tee artifacts/unit-tests.log

      - name: Prepare non-production validation environment
        run: |
          printf 'POSTGRES_PASSWORD=ci-only-postgres-password\nGRAFANA_ADMIN_PASSWORD=ci-only-grafana-password\n' > .env

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet 2>&1 | tee artifacts/compose-config.log

      - name: Upload static-check diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-diagnostics-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  integration:
    name: PostgreSQL and Kafka integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare disposable integration environment
        run: |
          mkdir -p artifacts
          printf 'POSTGRES_PASSWORD=ci-only-postgres-password\nGRAFANA_ADMIN_PASSWORD=ci-only-grafana-password\n' > .env
          echo "DATABASE_URL=postgresql://data_engineer:ci-only-postgres-password@localhost:5433/mpesa_analytics" >> "$GITHUB_ENV"
          echo "POSTGRES_HOST=localhost" >> "$GITHUB_ENV"
          echo "POSTGRES_PORT=5433" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=mpesa_analytics" >> "$GITHUB_ENV"
          echo "POSTGRES_USER=data_engineer" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=ci-only-postgres-password" >> "$GITHUB_ENV"
          echo "KAFKA_BROKERS=localhost:9092" >> "$GITHUB_ENV"
          echo "RUN_INTEGRATION_TESTS=1" >> "$GITHUB_ENV"

      - name: Start disposable PostgreSQL and Kafka
        run: docker compose up -d --wait postgres kafka 2>&1 | tee artifacts/compose-up.log

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip 2>&1 | tee artifacts/pip-upgrade.log
          python -m pip install -r requirements/base.txt -r requirements/data.txt "pytest==8.3.5" 2>&1 | tee artifacts/pip-install.log

      - name: Apply versioned database migrations
        run: alembic upgrade head 2>&1 | tee artifacts/alembic-upgrade.log

      - name: Verify migration is repeatable
        run: alembic upgrade head 2>&1 | tee artifacts/alembic-upgrade-repeat.log

      - name: Run full callback-to-Kafka-to-PostgreSQL and DLQ tests
        run: |
          mkdir -p artifacts
          python -m pytest -q tests/integration/test_event_delivery.py 2>&1 | tee artifacts/integration-tests.log

      - name: Run bounded synthetic webhook load smoke test
        run: |
          python -m pip install -r requirements/load.txt
          mkdir -p artifacts
          python -m app.database.outbox > artifacts/outbox-relay.log 2>&1 &
          RELAY_PID=$!
          gunicorn --bind 127.0.0.1:5000 --workers 1 ingestion.webhook_receiver:app > artifacts/webhook.log 2>&1 &
          WEBHOOK_PID=$!
          cleanup() {
            kill "$WEBHOOK_PID" "$RELAY_PID" 2>/dev/null || true
            wait "$WEBHOOK_PID" "$RELAY_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/ready >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:5000/ready | tee artifacts/readiness.json
          locust --headless --host=http://127.0.0.1:5000 -f tests/load/locustfile.py -u 2 -r 1 -t 10s --only-summary --exit-code-on-error 1 --csv=artifacts/locust | tee artifacts/locust-summary.log

      - name: Exercise PostgreSQL backup and restore against a disposable database
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          mkdir -p artifacts/backups
          BACKUP_DIR=artifacts/backups bash scripts/backup_postgres.sh | tee artifacts/backup.log
          backup_file="$(find artifacts/backups -maxdepth 1 -name '*.dump' -print -quit)"
          test -n "$backup_file"
          PGPASSWORD="$POSTGRES_PASSWORD" createdb -h localhost -p 5433 -U "$POSTGRES_USER" mpesa_restore_test
          RESTORE_TARGET_DATABASE_URL="postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:5433/mpesa_restore_test" CONFIRM_RESTORE=YES bash scripts/restore_postgres.sh "$backup_file" | tee artifacts/restore.log
          revision="$(PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -p 5433 -U "$POSTGRES_USER" -d mpesa_restore_test -Atc 'SELECT version_num FROM alembic_version')"
          test -n "$revision"
          echo "Restored Alembic revision: $revision" | tee artifacts/restore-verification.log
          PGPASSWORD="$POSTGRES_PASSWORD" psql -h localhost -p 5433 -U "$POSTGRES_USER" -d mpesa_restore_test -c 'SELECT COUNT(*) AS callback_events FROM mpesa_callback_events; SELECT COUNT(*) AS outbox_events FROM event_outbox; SELECT COUNT(*) AS dead_letters FROM kafka_dead_letters;' | tee -a artifacts/restore-verification.log

      - name: Capture service status and logs on failure
        if: failure()
        run: |
          docker compose ps 2>&1 | tee artifacts/compose-ps-on-failure.log
          docker compose logs --no-color postgres kafka zookeeper 2>&1 | tee artifacts/compose-services-on-failure.log

      - name: Upload reproducible CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable services
        if: always()
        run: docker compose down -v
