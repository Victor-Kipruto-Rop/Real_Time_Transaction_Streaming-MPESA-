name: Quality gates

on:
  pull_request:
  push:
    branches:
      - main
      - "hardening/**"

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-compose:
    name: Static syntax and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install focused configuration-test dependencies
        run: python -m pip install "pydantic==2.5.0" "pydantic-settings==2.1.0" "python-dotenv==1.0.0" "pytest==8.3.5" "SQLAlchemy==2.0.23" "psycopg2-binary==2.9.9"

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run configuration security regression tests
        run: python -m pytest -q tests/test_config_security.py tests/test_database_ddl.py tests/test_event_identity.py

      - name: Prepare non-production validation environment
        run: |
          printf 'POSTGRES_PASSWORD=ci-only-postgres-password\nGRAFANA_ADMIN_PASSWORD=ci-only-grafana-password\n' > .env

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
