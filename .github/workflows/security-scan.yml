name: Security Scan

on:
  push:
    branches: [ main, develop, "hardening/**" ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security scanners
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit bandit

      - name: Run dependency vulnerability audit
        id: dependency_audit
        continue-on-error: true
        run: pip-audit -r requirements.txt --no-deps --format=json --output=pip-audit-report.json

      - name: Run Bandit security linter
        id: bandit
        continue-on-error: true
        run: bandit -r app/ ingestion/ -f json -o bandit-report.json

      - name: Trivy vulnerability scanner
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.sha }}
          path: |
            pip-audit-report.json
            bandit-report.json
            trivy-results.sarif
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Trivy results to GitHub Security
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      - name: Enforce security scan outcomes
        if: always()
        env:
          DEPENDENCY_AUDIT_OUTCOME: ${{ steps.dependency_audit.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
        run: |
          failed=0
          for result in "dependency audit:$DEPENDENCY_AUDIT_OUTCOME" "Bandit:$BANDIT_OUTCOME" "Trivy:$TRIVY_OUTCOME"; do
            name="${result%%:*}"
            outcome="${result#*:}"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::$name did not pass (outcome=$outcome); inspect the uploaded report."
              failed=1
            fi
          done
          exit "$failed"
