name: pesaguard-elixir
services:
  webhook-delivery:
    build:
      context: ..
      dockerfile: Elixir/Dockerfile
      args:
        SERVICE: webhook-delivery
    environment:
      MIX_ENV: dev
      PORT: "8080"
      PHX_SERVER: "true"
      SECRET_KEY_BASE: "${ELIXIR_DEV_SECRET:-local-only-development-secret-change-before-use-000000000000000000000000000000000000000000000000}"
    ports:
      - "127.0.0.1:8200:8080"
    restart: unless-stopped
  notification-service:
