name: telixo-elixir
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telixo
      POSTGRES_USER: telixo
      POSTGRES_PASSWORD: "${ELIXIR_POSTGRES_PASSWORD:?set ELIXIR_POSTGRES_PASSWORD}"
    volumes:
      - elixir-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telixo -d telixo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  webhook-delivery:
    build:
      context: ..
      dockerfile: Elixir/Dockerfile
      args:
        SERVICE: webhook-delivery
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIX_ENV: prod
      PORT: "8080"
      PHX_SERVER: "true"
      PHX_HOST: "${PHX_HOST:-localhost}"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?set SECRET_KEY_BASE}"
      DATABASE_URL: "postgres://telixo:${ELIXIR_POSTGRES_PASSWORD}@postgres:5432/telixo"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET (at least 32 bytes)}"
      JWT_ISSUER: "${JWT_ISSUER:-telixo}"
      EVENT_RELAY_URL: "${EVENT_RELAY_URL:?set EVENT_RELAY_URL}"
      EVENT_RELAY_TOKEN: "${EVENT_RELAY_TOKEN:?set EVENT_RELAY_TOKEN (at least 32 bytes)}"
    ports:
      - "127.0.0.1:8200:8080"
    restart: unless-stopped
  notification-service:
    build:
      context: ..
      dockerfile: Elixir/Dockerfile
      args:
        SERVICE: notification-service
    depends_on:
