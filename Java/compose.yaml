name: pesaguard-java
services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
    ports:
      - "127.0.0.1:8100:8080"
    restart: unless-stopped
