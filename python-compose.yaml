name: pesaguard-python
services:
  python-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: docker
      DATABASE_URL: "${PYTHON_DATABASE_URL:-postgresql://pesaguard_dev:local-only-change-me@postgres:5432/pesaguard_dev}"
      REDIS_URL: "${PYTHON_REDIS_URL:-redis://:local-only-change-me@redis:6379/0}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BROKERS:-redpanda:9092}"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  risk-scoring:
    build:
      context: Python/services/risk-scoring
      dockerfile: Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:8300:8300"
    restart: unless-stopped
